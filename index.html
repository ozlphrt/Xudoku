<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Xudoku</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <meta name="msapplication-TileColor" content="#000000">
    <meta name="msapplication-navbutton-color" content="#000000">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700;800;900&family=Nunito:wght@300;400;500;600;700;800;900&family=Fredoka:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* ========================================
           RESET & BASE STYLES
        ======================================== */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            height: 100vh;
            height: 100dvh; /* Dynamic viewport height for mobile browsers */
            width: 100vw;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #000000;
            height: 100vh;
            height: 100dvh; /* Dynamic viewport height for mobile browsers */
            width: 100vw;
            color: #ffffff;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            margin: 0;
            padding: 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        /* ========================================
           TOP BAR
        ======================================== */
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            padding-top: max(12px, env(safe-area-inset-top));
            background: #000000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            height: 60px;
            height: calc(60px + env(safe-area-inset-top));
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .hint-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #ffffff;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .hint-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .timer-display {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #ffffff;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            font-family: monospace;
        }

        .difficulty-buttons {
            display: flex;
            gap: 6px;
        }

        .difficulty-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #ffffff;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .difficulty-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .difficulty-btn.active {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* ========================================
           MAIN CONTAINER
        ======================================== */
        
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            height: 100dvh; /* Dynamic viewport height for mobile browsers */
            padding: 80px 16px 16px 16px;
            padding-top: calc(80px + env(safe-area-inset-top));
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
            padding-left: calc(16px + env(safe-area-inset-left));
            padding-right: calc(16px + env(safe-area-inset-right));
        }

        /* ========================================
           SUDOKU GRID
        ======================================== */
        
        .sudoku-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
            max-width: min(90vw, 90vh);
        }

        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            gap: 1px;
            background: transparent;
            border: none;
            border-radius: 16px;
            padding: 0;
            width: 100%;
            height: 100%;
            max-width: min(90vw, 90vh);
            max-height: min(90vw, 90vh);
        }

        .cell {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.5rem, 4vw, 3rem);
            font-weight: 700;
            font-family: 'Fredoka', 'Nunito', 'Quicksand', 'Verdana', 'Arial Rounded MT Bold', 'Helvetica Rounded', Arial, sans-serif;
            cursor: pointer;
            color: #ffffff;
            position: relative;
            min-height: 0;
            min-width: 0;
            box-shadow: none;
        }

        .cell:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .cell.selected {
            background: rgba(74, 93, 74, 0.3);
        }

        .cell.highlighted {
            background: rgba(74, 93, 74, 0.2);
        }

        .cell.same-number-highlight {
            background: rgba(0, 200, 0, 0.25) !important;
            border-color: rgba(0, 200, 0, 0.5) !important;
        }

        .cell.number-selected {
            background: rgba(0, 200, 0, 0.25) !important;
            border-color: rgba(0, 200, 0, 0.5) !important;
        }

        .cell.note-selected {
            background: rgba(255, 0, 0, 0.25) !important;
            border-color: rgba(255, 0, 0, 0.5) !important;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .cell.shake {
            animation: shake 0.15s ease-in-out;
        }
        
        .cell.shake:not(.number-selected) {
            background: rgba(255, 0, 0, 0.3) !important;
            border-color: rgba(255, 0, 0, 0.8) !important;
        }

        @keyframes celebration {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0px rgba(0, 255, 0, 0); }
            10% { transform: scale(1.05); box-shadow: 0 0 20px rgba(0, 255, 0, 0.8); }
            20% { transform: scale(0.95); box-shadow: 0 0 15px rgba(0, 255, 0, 0.6); }
            30% { transform: scale(1.05); box-shadow: 0 0 20px rgba(0, 255, 0, 0.8); }
            40% { transform: scale(0.95); box-shadow: 0 0 15px rgba(0, 255, 0, 0.6); }
            50% { transform: scale(1.05); box-shadow: 0 0 20px rgba(0, 255, 0, 0.8); }
            60% { transform: scale(1); box-shadow: 0 0 10px rgba(0, 255, 0, 0.4); }
        }

        .cell.celebrate {
            animation: celebration 0.6s ease-in-out;
            background: rgba(0, 255, 0, 0.2) !important;
        }

        .cell.given {
            background: transparent;
            font-weight: 600;
            color: #ffffff;
        }

        .cell.number-complete {
            opacity: 0.4;
            color: rgba(255, 255, 255, 0.4) !important;
        }

        .cell.given.number-complete {
            color: rgba(255, 255, 255, 0.4) !important;
        }

        /* Thick borders for 3x3 block separations */
        .cell:nth-child(3n):not(:nth-child(9n)) {
            border-right: 3px solid rgba(255, 255, 255, 0.2);
        }

        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) {
            border-bottom: 3px solid rgba(255, 255, 255, 0.2);
        }

        /* ========================================
           NOTES SYSTEM
        ======================================== */
        
        .cell.notes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 2px;
            padding: 4px;
            font-size: clamp(0.6rem, 1.5vw, 1rem);
            font-weight: 600;
        }

        .cell.notes .note-number {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-family: 'Fredoka', 'Nunito', 'Quicksand', 'Verdana', 'Arial Rounded MT Bold', 'Helvetica Rounded', Arial, sans-serif;
        }

        .cell.notes .note-number:empty {
            display: none;
        }

        .note-number-highlight {
            background: #8b4c4c !important;
            opacity: 1 !important;
            color: #ffffff !important;
            border: 2px solid #6b3a3a !important;
            border-radius: 0 !important;
            font-weight: 900 !important;
        }

        .note-number-error {
            background: rgba(255, 0, 0, 0.3) !important;
            opacity: 1 !important;
            color: #ffffff !important;
            border: 2px solid rgba(255, 0, 0, 0.5) !important;
            border-radius: 0 !important;
            font-weight: 900 !important;
            animation: noteNumberErrorPulse 0.6s ease-out;
        }

        @keyframes noteNumberErrorPulse {
            0%, 100% { 
                opacity: 1;
                transform: scale(1);
            }
            50% { 
                opacity: 0.7;
                transform: scale(1.1);
            }
        }

        /* ========================================
           NUMBER PAD
        ======================================== */
        
        .number-pad {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .num-btn {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Fredoka', 'Nunito', 'Quicksand', 'Verdana', 'Arial Rounded MT Bold', 'Helvetica Rounded', Arial, sans-serif;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .num-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .num-btn.selected {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }

        /* ========================================
           RESPONSIVE DESIGN
        ======================================== */
        
        @media (max-width: 768px) {
            .top-bar {
                padding: 10px 12px;
                height: 56px;
            }

            .hint-btn {
                padding: 6px 12px;
                font-size: 12px;
            }

            .timer-display {
                padding: 6px 12px;
                font-size: 12px;
            }

            .difficulty-btn {
                padding: 6px 10px;
                font-size: 11px;
            }

            .main-container {
                padding: 70px 12px 12px 12px;
            }

            .sudoku-grid {
                max-width: min(95vw, 95vh);
                max-height: min(95vw, 95vh);
            }

            .cell {
                font-size: clamp(1.2rem, 5vw, 2.5rem);
            }

            .cell.notes {
                font-size: clamp(0.5rem, 2vw, 0.8rem);
            }

            .num-btn {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }

            .number-pad {
                gap: 6px;
                margin-top: 16px;
            }
        }

        @media (max-width: 480px) {
            .top-bar {
                padding: 8px 10px;
                height: 52px;
            }

            .hint-btn {
                padding: 5px 10px;
                font-size: 11px;
            }

            .timer-display {
                padding: 5px 10px;
                font-size: 11px;
            }

            .difficulty-btn {
                padding: 5px 8px;
                font-size: 10px;
            }

            .main-container {
                padding: 65px 10px 10px 10px;
            }

            .cell {
                font-size: clamp(1rem, 6vw, 2rem);
            }

            .num-btn {
                width: 36px;
                height: 36px;
                font-size: 14px;
            }

            .number-pad {
                gap: 4px;
                margin-top: 12px;
            }
        }

        /* ========================================
           ANIMATIONS
        ======================================== */
        
        @keyframes numberPlace {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.1);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes errorShake {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-8px) rotate(-2deg); }
            20%, 40%, 60%, 80% { transform: translateX(8px) rotate(2deg); }
        }

        @keyframes successRipple {
            0% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(1.5);
            }
        }

        @keyframes completionCelebration {
            0% {
                background: rgba(0, 255, 0, 0.2);
                transform: scale(1);
            }
            10% {
                background: rgba(0, 255, 0, 0.4);
                transform: scale(1.1) translateX(-2px);
            }
            20% {
                background: rgba(0, 255, 0, 0.2);
                transform: scale(1.15) translateX(2px);
            }
            30% {
                background: rgba(0, 255, 0, 0.4);
                transform: scale(1.1) translateX(-1px);
            }
            40% {
                background: rgba(0, 255, 0, 0.2);
                transform: scale(1.15) translateX(1px);
            }
            50% {
                background: rgba(0, 255, 0, 0.4);
                transform: scale(1.1) translateX(-1px);
            }
            60% {
                background: rgba(0, 255, 0, 0.2);
                transform: scale(1.15) translateX(1px);
            }
            70% {
                background: rgba(0, 255, 0, 0.4);
                transform: scale(1.1) translateX(0);
            }
            80% {
                background: rgba(0, 255, 0, 0.2);
                transform: scale(1.05) translateX(0);
            }
            100% {
                background: rgba(0, 255, 0, 0.2);
                transform: scale(1) translateX(0);
            }
        }

        @keyframes hintGlow {
            0%, 100% {
                opacity: 0.9;
            }
            50% {
                opacity: 1;
            }
        }

        /* ========================================
           PWA FULLSCREEN OPTIMIZATIONS
        ======================================== */
        
        /* Hide browser UI elements */
        body::-webkit-scrollbar {
            display: none;
        }
        
        /* Prevent overscroll bounce on iOS */
        body {
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
        }
        
        /* Ensure full viewport usage */
        @supports (height: 100dvh) {
            .main-container {
                height: 100dvh;
            }
        }
        
        /* iOS specific fixes */
        @supports (-webkit-touch-callout: none) {
            body {
                -webkit-text-size-adjust: 100%;
                -webkit-tap-highlight-color: transparent;
            }
        }
        
        /* Android specific fixes */
        @media screen and (-webkit-min-device-pixel-ratio: 0) {
            body {
                -webkit-appearance: none;
            }
        }

        /* ========================================
           INSTALL PROMPT STYLES
        ======================================== */
        
        .install-prompt {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 20px;
            z-index: 10000;
            backdrop-filter: blur(10px);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            display: none; /* Hidden by default */
        }

        .install-prompt.show {
            transform: translateY(0);
            opacity: 1;
        }

        .install-prompt-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .install-prompt-icon {
            width: 32px;
            height: 32px;
            background: #ffffff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .install-prompt-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            margin: 0;
        }

        .install-prompt-message {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            margin: 0 0 16px 0;
            line-height: 1.4;
        }

        .install-prompt-actions {
            display: flex;
            gap: 12px;
        }

        .install-prompt-btn {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .install-prompt-btn.primary {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .install-prompt-btn.primary:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .install-prompt-btn.secondary {
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .install-prompt-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
        }

        .install-prompt-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 24px;
            height: 24px;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .install-prompt-close:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        /* Show install prompt on all devices for testing */
        /* @media (min-width: 769px) {
            .install-prompt {
                display: none;
            }
        } */
    </style>
</head>

<body>
    <!-- Top Bar -->
    <div class="top-bar">
        <button class="hint-btn" onclick="solveHint()" title="Get Hint">Hint</button>
        <div class="timer-display" id="timer">00:00:00</div>
        <div class="difficulty-buttons">
            <button class="difficulty-btn active" onclick="setDifficulty('easy')">Easy</button>
            <button class="difficulty-btn" onclick="setDifficulty('medium')">Medium</button>
            <button class="difficulty-btn" onclick="setDifficulty('hard')">Hard</button>
        </div>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Sudoku Grid -->
        <div class="sudoku-container">
            <div class="sudoku-grid" id="sudokuGrid"></div>
        </div>

        <!-- Number Pad -->
        <div class="number-pad">
            <button class="num-btn" onclick="selectNumber(1)">1</button>
            <button class="num-btn" onclick="selectNumber(2)">2</button>
            <button class="num-btn" onclick="selectNumber(3)">3</button>
            <button class="num-btn" onclick="selectNumber(4)">4</button>
            <button class="num-btn" onclick="selectNumber(5)">5</button>
            <button class="num-btn" onclick="selectNumber(6)">6</button>
            <button class="num-btn" onclick="selectNumber(7)">7</button>
            <button class="num-btn" onclick="selectNumber(8)">8</button>
            <button class="num-btn" onclick="selectNumber(9)">9</button>
        </div>
    </div>

    <!-- Install Prompt -->
    <div class="install-prompt" id="installPrompt">
        <button class="install-prompt-close" onclick="hideInstallPrompt()">×</button>
        <div class="install-prompt-header">
            <div class="install-prompt-icon">📱</div>
            <h3 class="install-prompt-title">Install Xudoku</h3>
        </div>
        <p class="install-prompt-message">
            Add Xudoku to your home screen for a better gaming experience with full screen mode and offline play.
        </p>
        <div class="install-prompt-actions">
            <button class="install-prompt-btn primary" onclick="installApp()">Install App</button>
            <button class="install-prompt-btn secondary" onclick="hideInstallPrompt()">Not Now</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Global variables
        let selectedNumber = null;
        let isInitialized = false;

        function initializeApp() {
            if (isInitialized) return;
            isInitialized = true;

            console.log('🎮 Initializing Xudoku Game...');
            
            // Wait a bit to ensure all scripts are loaded
            setTimeout(() => {
                try {
                    // Check if puzzle database is available
                    if (typeof expandedPuzzleDatabase !== 'undefined') {
                        console.log('✅ Expanded puzzle database loaded');
                    } else {
                        console.log('⚠️ Expanded puzzle database not loaded, using built-in puzzles only');
                    }
                    
                    window.game = new SudokuGame();
                    console.log('✅ Game created successfully:', window.game);
                    console.log('✅ Grid element exists:', document.getElementById('sudokuGrid'));
                    console.log('✅ Cells created:', document.querySelectorAll('.cell').length);
                } catch (error) {
                    console.error('❌ Error creating game:', error);
                }
            }, 100);
        }

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp);
        } else {
            initializeApp();
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', function() {
            if (window.game) {
                if (window.game.autoSaveInterval) {
                    clearInterval(window.game.autoSaveInterval);
                }
                if (window.game.timer) {
                    clearInterval(window.game.timer);
                }
                window.game = null;
            }
        });

        // Prevent multiple game instances
        if (typeof window.game !== 'undefined' && window.game !== null) {
            console.log('🔄 Cleaning up existing game instance...');
            if (window.game.autoSaveInterval) {
                clearInterval(window.game.autoSaveInterval);
            }
            if (window.game.timer) {
                clearInterval(window.game.timer);
            }
            window.game = null;
        }

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('✅ Service Worker registered successfully:', registration.scope);
                    })
                    .catch((error) => {
                        console.log('❌ Service Worker registration failed:', error);
                    });
            });
        }

        // Handle PWA install prompt
        let deferredPrompt;
        let installPromptShown = false;
        
        console.log('🔍 Initializing install prompt...');
        
        window.addEventListener('beforeinstallprompt', (e) => {
            console.log('📱 PWA install prompt available');
            e.preventDefault();
            deferredPrompt = e;
            
            // Show custom install prompt after a delay
            setTimeout(() => {
                showInstallPrompt();
            }, 2000);
        });

        window.addEventListener('appinstalled', () => {
            console.log('🎉 PWA was installed successfully');
            deferredPrompt = null;
            hideInstallPrompt();
        });

        // Check if app is already installed
        function isAppInstalled() {
            // Check for standalone display mode (PWA installed)
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
            
            // Check for iOS Safari standalone mode
            const isIOSStandalone = window.navigator.standalone === true;
            
            // Check if launched from home screen (additional indicators)
            const isFromHomeScreen = window.matchMedia('(display-mode: minimal-ui)').matches ||
                                   window.matchMedia('(display-mode: fullscreen)').matches;
            
            // Check URL parameters that might indicate PWA launch
            const urlParams = new URLSearchParams(window.location.search);
            const isPWALaunch = urlParams.has('source') && urlParams.get('source') === 'pwa';
            
            const isInstalled = isStandalone || isIOSStandalone || isFromHomeScreen || isPWALaunch;
            
            console.log('🔍 App installed check:');
            console.log('  - Standalone:', isStandalone);
            console.log('  - iOS Standalone:', isIOSStandalone);
            console.log('  - From Home Screen:', isFromHomeScreen);
            console.log('  - PWA Launch:', isPWALaunch);
            console.log('  - Final Result:', isInstalled);
            
            return isInstalled;
        }

        // Show install prompt
        function showInstallPrompt() {
            console.log('🔍 Attempting to show install prompt...');
            console.log('🔍 Is app installed:', isAppInstalled());
            console.log('🔍 Install prompt shown:', installPromptShown);
            console.log('🔍 Deferred prompt available:', !!deferredPrompt);
            
            // Don't show if already installed
            if (isAppInstalled()) {
                console.log('❌ Not showing prompt - app already installed');
                hideInstallPrompt();
                return;
            }
            
            // Don't show if already shown
            if (installPromptShown) {
                console.log('❌ Not showing prompt - already shown');
                return;
            }
            
            const prompt = document.getElementById('installPrompt');
            if (prompt) {
                console.log('✅ Showing install prompt');
                prompt.style.display = 'block';
                prompt.classList.add('show');
                installPromptShown = true;
            } else {
                console.log('❌ Install prompt element not found');
            }
        }

        // Hide install prompt
        function hideInstallPrompt() {
            const prompt = document.getElementById('installPrompt');
            if (prompt) {
                prompt.style.display = 'none';
                prompt.classList.remove('show');
                installPromptShown = true;
                localStorage.setItem('xudoku-install-prompt-seen', 'true');
                console.log('✅ Install prompt hidden');
            }
        }

        // Install app
        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('✅ User accepted the install prompt');
                    } else {
                        console.log('❌ User dismissed the install prompt');
                    }
                    deferredPrompt = null;
                    hideInstallPrompt();
                });
            } else {
                // Fallback for browsers that don't support the install prompt
                alert('To install this app, please use your browser menu and select "Add to Home Screen"');
                hideInstallPrompt();
            }
        }

        // Show install prompt on first visit (if not already installed)
        function checkAndShowInstallPrompt() {
            console.log('🔍 Checking if should show install prompt...');
            console.log('🔍 Window width:', window.innerWidth);
            console.log('🔍 Is mobile:', window.innerWidth <= 768);
            console.log('🔍 Is app installed:', isAppInstalled());
            console.log('🔍 User agent:', navigator.userAgent);
            console.log('🔍 Display mode:', window.matchMedia('(display-mode: standalone)').matches);
            console.log('🔍 Navigator standalone:', window.navigator.standalone);
            
            // Always show prompt on mobile if not installed, regardless of previous dismissal
            if (window.innerWidth <= 768 && !isAppInstalled()) {
                console.log('✅ Will show install prompt after delay');
                setTimeout(() => {
                    showInstallPrompt();
                }, 2000);
            } else if (window.innerWidth > 768 && !isAppInstalled()) {
                // Show on desktop too for testing
                console.log('✅ Will show install prompt on desktop after delay');
                setTimeout(() => {
                    showInstallPrompt();
                }, 3000);
            } else {
                console.log('❌ Not showing prompt - already installed');
            }
        }

        // Initialize install prompt check
        setTimeout(checkAndShowInstallPrompt, 1000);
        
        // Check if app is already installed on page load
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🔍 DOM loaded - checking if app is already installed...');
            if (isAppInstalled()) {
                console.log('✅ App is already installed - hiding install prompt');
                hideInstallPrompt();
            }
        });
        
        // Fallback: Show install prompt if beforeinstallprompt doesn't fire
        setTimeout(() => {
            if (!deferredPrompt && !isAppInstalled()) {
                console.log('🔄 Fallback: Showing install prompt without beforeinstallprompt event');
                showInstallPrompt();
            }
        }, 5000);
        
        // Add manual trigger for testing (remove in production)
        window.testInstallPrompt = function() {
            console.log('🧪 Manual test trigger');
            showInstallPrompt();
        };
        
        // Add keyboard shortcut for testing (Ctrl+Shift+I)
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.shiftKey && e.key === 'I') {
                e.preventDefault();
                console.log('🧪 Keyboard test trigger');
                showInstallPrompt();
            }
        });
    </script>
</body>
</html>
